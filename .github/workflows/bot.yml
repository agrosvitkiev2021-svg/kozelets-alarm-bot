name: Run Kozelets Alarm Bot

on:
  schedule:
    - cron: '*/5 * * * *'  # Запуск кожні 5 хвилин
  workflow_dispatch:       # Можливість ручного запуску

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedparser

      - name: Run bot script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
        run: python main.py

      # ВАЖЛИВО: Зберігаємо оновлений bot_state.json у Git
      - name: Commit and push updated bot state
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bot_state.json
          git commit -m "auto: update bot state" || exit 0
          git push
