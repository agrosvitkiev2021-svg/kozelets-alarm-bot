name: Kozelets Alarm Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: kozelets-alarm-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHANNEL: ${{ secrets.CHANNEL }}
      AIR_API_TOKEN: ${{ secrets.AIR_API_TOKEN }}

    steps:
      - name: Завантаження коду
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Встановлення Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановлення бібліотек
        run: |
          pip install requests feedparser

      - name: Запуск бота
        run: |
          python main.py

      - name: Збереження пам'яті бота
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_state.json
          git diff --cached --quiet || git commit -m "Оновлення стану бота"
          git push
